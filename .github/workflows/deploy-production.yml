name: Deploy

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [closed]
    branches:
      - main
      - develop

concurrency:
  group: terraform-deploy-${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.set-env.outputs.env }}
      state-bucket: ${{ steps.set-env.outputs.state-bucket }}
    steps:
      - id: set-env
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BRANCH="${{ github.event.pull_request.base.ref }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi
          if [ "$BRANCH" == "main" ]; then
            echo "env=production" >> $GITHUB_OUTPUT
            echo "state-bucket=boston-mcp-tf-state-prod" >> $GITHUB_OUTPUT
          else
            echo "env=development" >> $GITHUB_OUTPUT
            echo "state-bucket=boston-mcp-tf-state-dev" >> $GITHUB_OUTPUT
          fi

  lint-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Check Python syntax
        run: |
          python -m compileall -q servers/

      - name: Check code formatting with black
        run: |
          black --check --diff servers/ || echo "⚠️ Black formatting issues found (non-blocking)"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.0.0"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: servers/boston_opendata_lambda/terraform
        run: |
          terraform init -backend=false

      - name: Terraform Validate
        working-directory: servers/boston_opendata_lambda/terraform
        run: |
          terraform validate

  terraform-plan:
    runs-on: ubuntu-latest
    needs: [lint-validate, determine-environment]
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    environment: ${{ needs.determine-environment.outputs.env }}
    env:
      TF_VAR_ecr_repository_name: ${{ vars.TF_VAR_ECR_REPOSITORY_NAME }}
      TF_VAR_lambda_function_name: ${{ vars.TF_VAR_LAMBDA_FUNCTION_NAME }}
      TF_VAR_tags: ${{ vars.TF_VAR_TAGS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.0.0"
          terraform_wrapper: false

      - name: Terraform Init (with backend state)
        working-directory: servers/boston_opendata_lambda/terraform
        run: |
          echo "Initializing Terraform with backend state from S3..."
          terraform init -backend-config="bucket=${{ needs.determine-environment.outputs.state-bucket }}"
          echo "✅ Successfully initialized with backend state"

      - name: Refresh Terraform State
        working-directory: servers/boston_opendata_lambda/terraform
        run: |
          echo "Refreshing Terraform state to get latest from S3..."
          terraform refresh -no-color || echo "⚠️ State refresh completed with warnings"
          echo "✅ State refreshed successfully"

      - name: Terraform Validate (with backend state)
        working-directory: servers/boston_opendata_lambda/terraform
        run: |
          echo "Validating Terraform configuration with backend state..."
          terraform validate
          echo "✅ Validation passed"

      - name: Terraform Plan
        working-directory: servers/boston_opendata_lambda/terraform
        run: |
          echo "Generating Terraform execution plan..."
          terraform plan -no-color -out=tfplan
          echo "✅ Plan generated successfully"

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: servers/boston_opendata_lambda/terraform/tfplan
          retention-days: 1

  terraform-apply:
    runs-on: ubuntu-latest
    needs: [terraform-plan, determine-environment]
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    environment: ${{ needs.determine-environment.outputs.env }}
    env:
      TF_VAR_ecr_repository_name: ${{ vars.TF_VAR_ECR_REPOSITORY_NAME }}
      TF_VAR_lambda_function_name: ${{ vars.TF_VAR_LAMBDA_FUNCTION_NAME }}
      TF_VAR_tags: ${{ vars.TF_VAR_TAGS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.0.0"
          terraform_wrapper: false

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: servers/boston_opendata_lambda/terraform/

      - name: Terraform Init (with backend state)
        working-directory: servers/boston_opendata_lambda/terraform
        run: |
          echo "Initializing Terraform with backend state from S3..."
          terraform init -backend-config="bucket=${{ needs.determine-environment.outputs.state-bucket }}"
          echo "✅ Successfully initialized with backend state"
          echo "ℹ️ Note: State was already refreshed in terraform-plan job, skipping refresh here to avoid stale plan error"

      - name: Terraform Validate (with backend state)
        working-directory: servers/boston_opendata_lambda/terraform
        run: |
          echo "Validating Terraform configuration with backend state..."
          terraform validate
          echo "✅ Validation passed"

      - name: Import Existing Resources (if needed)
        working-directory: servers/boston_opendata_lambda/terraform
        continue-on-error: true
        run: |
          # Get AWS account ID and region
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION=$(aws configure get region || echo "us-east-1")

          # Get resource names from environment variables (TF_VAR_* are set by workflow)
          ECR_REPO="$TF_VAR_ecr_repository_name"
          LAMBDA_FUNC="$TF_VAR_lambda_function_name"
          IAM_ROLE="${LAMBDA_FUNC}-execution-role"
          LOG_GROUP="/aws/lambda/${LAMBDA_FUNC}"

          echo "Checking for existing resources..."
          echo "ECR Repository: $ECR_REPO"
          echo "Lambda Function: $LAMBDA_FUNC"
          echo "IAM Role: $IAM_ROLE"
          echo "Log Group: $LOG_GROUP"

          # Import ECR repository if it exists
          if aws ecr describe-repositories --repository-names "$ECR_REPO" --region "$REGION" &>/dev/null; then
            echo "ECR repository exists, attempting import..."
            terraform import aws_ecr_repository.boston_opendata_mcp "$ECR_REPO" 2>&1 || echo "ECR repository already in state or import failed"
          else
            echo "ECR repository does not exist, skipping import"
          fi

          # Import IAM role if it exists
          if aws iam get-role --role-name "$IAM_ROLE" &>/dev/null; then
            echo "IAM role exists, attempting import..."
            terraform import aws_iam_role.lambda_execution "$IAM_ROLE" 2>&1 || echo "IAM role already in state or import failed"
          else
            echo "IAM role does not exist, skipping import"
          fi

          # Import CloudWatch log group if it exists
          LOG_EXISTS=$(aws logs describe-log-groups --log-group-name-prefix "$LOG_GROUP" --region "$REGION" --query "logGroups[?logGroupName=='$LOG_GROUP'].logGroupName" --output text 2>/dev/null || echo "")
          if [ -n "$LOG_EXISTS" ] && [ "$LOG_EXISTS" == "$LOG_GROUP" ]; then
            echo "CloudWatch log group exists, attempting import..."
            # Check if resource is already in state
            if terraform state show aws_cloudwatch_log_group.lambda_logs &>/dev/null; then
              echo "Log group already in Terraform state"
            else
              # Try to import, handling various error cases
              terraform import aws_cloudwatch_log_group.lambda_logs "$LOG_GROUP" 2>&1 | tee /tmp/import_log.txt || {
                IMPORT_ERROR=$(cat /tmp/import_log.txt 2>/dev/null || echo "")
                if echo "$IMPORT_ERROR" | grep -q "already managed\|Resource already managed"; then
                  echo "Log group already in state"
                elif echo "$IMPORT_ERROR" | grep -q "AccessDeniedException\|ListTagsForResource"; then
                  echo "Warning: Import failed due to permission issues, but log group exists in AWS"
                  echo "Terraform will attempt to manage it. If creation fails, the log group already exists."
                else
                  echo "Log group import failed: $IMPORT_ERROR"
                  echo "Continuing - Terraform will handle existing resource during apply"
                fi
              }
            fi
          else
            echo "CloudWatch log group does not exist, skipping import"
          fi

          # Refresh state after imports
          echo "Refreshing Terraform state..."
          terraform refresh -no-color || true

          # Show current state to verify imports
          echo "Current Terraform state:"
          terraform state list || echo "No resources in state yet"

      - name: Terraform Apply (using plan file)
        working-directory: servers/boston_opendata_lambda/terraform
        run: |
          echo "Applying Terraform plan..."
          if [ -f "tfplan" ]; then
            echo "✅ Using plan file from terraform-plan job"
            terraform apply -auto-approve tfplan
          else
            echo "⚠️ Plan file not found, running apply without plan file"
            terraform apply -auto-approve 2>&1 | tee /tmp/apply_output.txt || {
              APPLY_ERROR=$(cat /tmp/apply_output.txt 2>/dev/null || echo "")
              if echo "$APPLY_ERROR" | grep -q "ResourceAlreadyExistsException.*log group"; then
                echo "Log group already exists, attempting to import..."
                LOG_GROUP="/aws/lambda/$TF_VAR_lambda_function_name"
                terraform import aws_cloudwatch_log_group.lambda_logs "$LOG_GROUP" || {
                  echo "Import still failed, but log group exists. Continuing..."
                }
                echo "Retrying terraform apply..."
                terraform apply -auto-approve
              else
                echo "Terraform apply failed: $APPLY_ERROR"
                exit 1
              fi
            }
          fi
          echo "✅ Terraform apply completed successfully"

      - name: Get Terraform Outputs
        id: terraform-outputs
        working-directory: servers/boston_opendata_lambda/terraform
        run: |
          echo "function_url=$(terraform output -raw function_url)" >> $GITHUB_OUTPUT
          echo "lambda_function_name=$(terraform output -raw lambda_function_name)" >> $GITHUB_OUTPUT
          echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT

      - name: Display Deployment Outputs
        run: |
          echo "## 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Lambda Function URL" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ steps.terraform-outputs.outputs.function_url }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Lambda Function Name" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ steps.terraform-outputs.outputs.lambda_function_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ECR Repository URL" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ steps.terraform-outputs.outputs.ecr_repository_url }}\`" >> $GITHUB_STEP_SUMMARY
