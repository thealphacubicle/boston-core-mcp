name: Deploy

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [closed]
    branches:
      - main
      - develop

concurrency:
  group: terraform-deploy-${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.set-env.outputs.env }}
      state-bucket: ${{ steps.set-env.outputs.state-bucket }}
    steps:
      - id: set-env
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BRANCH="${{ github.event.pull_request.base.ref }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi
          if [ "$BRANCH" == "main" ]; then
            echo "env=production" >> $GITHUB_OUTPUT
            echo "state-bucket=boston-mcp-tf-state-prod" >> $GITHUB_OUTPUT
          else
            echo "env=development" >> $GITHUB_OUTPUT
            echo "state-bucket=boston-mcp-tf-state-dev" >> $GITHUB_OUTPUT
          fi

  lint-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Check Python syntax
        run: |
          python -m compileall -q servers/

      - name: Check code formatting with black
        run: |
          black --check --diff servers/ || echo "⚠️ Black formatting issues found (non-blocking)"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.0.0"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: servers/boston_opendata_lambda/terraform
        run: |
          terraform init -backend=false

      - name: Terraform Validate
        working-directory: servers/boston_opendata_lambda/terraform
        run: |
          terraform validate

  terraform-plan:
    runs-on: ubuntu-latest
    needs: [lint-validate, determine-environment]
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    environment: ${{ needs.determine-environment.outputs.env }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.0.0"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: servers/boston_opendata_lambda/terraform
        run: |
          terraform init -backend-config="bucket=${{ needs.determine-environment.outputs.state-bucket }}"

      - name: Terraform Plan
        working-directory: servers/boston_opendata_lambda/terraform
        run: |
          terraform plan -no-color -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v3
        with:
          name: tfplan
          path: servers/boston_opendata_lambda/terraform/tfplan
          retention-days: 1

  terraform-apply:
    runs-on: ubuntu-latest
    needs: [terraform-plan, determine-environment]
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    environment: ${{ needs.determine-environment.outputs.env }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.0.0"
          terraform_wrapper: false

      - name: Download Terraform Plan
        uses: actions/download-artifact@v3
        with:
          name: tfplan
          path: servers/boston_opendata_lambda/terraform

      - name: Terraform Init
        working-directory: servers/boston_opendata_lambda/terraform
        run: |
          terraform init -backend-config="bucket=${{ needs.determine-environment.outputs.state-bucket }}"

      - name: Terraform Apply
        working-directory: servers/boston_opendata_lambda/terraform
        run: |
          terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: terraform-outputs
        working-directory: servers/boston_opendata_lambda/terraform
        run: |
          echo "function_url=$(terraform output -raw function_url)" >> $GITHUB_OUTPUT
          echo "lambda_function_name=$(terraform output -raw lambda_function_name)" >> $GITHUB_OUTPUT
          echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT

      - name: Display Deployment Outputs
        run: |
          echo "## 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Lambda Function URL" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ steps.terraform-outputs.outputs.function_url }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Lambda Function Name" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ steps.terraform-outputs.outputs.lambda_function_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ECR Repository URL" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ steps.terraform-outputs.outputs.ecr_repository_url }}\`" >> $GITHUB_STEP_SUMMARY
